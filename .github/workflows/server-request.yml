name: Node.js POST to Self-Signed SSL Server

on:
  workflow_dispatch:  # 수동 실행 가능
  push:
    branches:
      - main

jobs:
  post-request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 1️⃣ Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 2️⃣ Node.js 의존성 설치 (node-fetch)
      - name: Install dependencies
        run: |
          npm init -y
          npm install node-fetch@3

      # 3️⃣ Node.js 스크립트 작성
      - name: Create Node.js request script
        run: |
          cat << 'EOF' > postRequest.js
          import fetch from 'node-fetch';
          import https from 'https';

          const agent = new https.Agent({ rejectUnauthorized: false });

          (async () => {
            try {
              // 반복해서 테스트 가능
              const response = await fetch("https://152.67.204.46:28585/movieimgajax", {
                method: "POST",
                body: new URLSearchParams({ title: "영화 예시" }),
                agent: agent,
                headers: { "Content-Type": "application/x-www-form-urlencoded" }
              });

              const txt = await response.json();
              console.log("Response from server:", txt);
            } catch (err) {
              console.error("Request failed:", err);
            }
          })();
          EOF

      # 4️⃣ Node.js 스크립트 실행
      - name: Run Node.js request
        run: |
          node postRequest.js
