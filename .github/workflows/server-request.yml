name: Server Request with self-signed SSL

on:
  workflow_dispatch:

jobs:
  server-request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 1️⃣ 서버 초기화
      - name: Initialize server
        run: |
          echo "Initializing server..."
          curl -k https://152.67.204.46:28585/ || true

      # 2️⃣ 서버 준비 확인
      - name: Wait for server readiness
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..10}; do
            status=$(curl -k -s -o /dev/null -w "%{http_code}" https://152.67.204.46:28585/)
            if [ "$status" -eq 200 ]; then
              echo "Server is ready!"
              break
            fi
            echo "Server not ready yet, retrying..."
            sleep 5
          done

      # 3️⃣ 실제 API 요청 (존재하는 경로로)
      - name: Send API request
        run: |
          curl -k -X POST https://152.67.204.46:28585/ \
            -H "Content-Type: application/json" \
            -d '{"key":"value"}'
