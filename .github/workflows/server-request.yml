name: Server Request with Python Self-Signed SSL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  server-request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 서버 초기화
      - name: Initialize server
        run: |
          echo "Initializing server..."
          curl --cacert .github/certs/cert.pem https://152.67.204.46:28585/ || true

      # 서버 준비 확인
      - name: Wait for server readiness
        run: |
          for i in {1..10}; do
            status=$(curl --cacert .github/certs/cert.pem -s -o /dev/null -w "%{http_code}" https://152.67.204.46:28585/)
            if [ "$status" -eq 200 ]; then
              echo "Server is ready!"
              break
            fi
            echo "Server not ready, retrying..."
            sleep 5
          done

      # 실제 API 요청
      - name: Send API request
        run: |
          curl --cacert .github/certs/cert.pem -X POST https://152.67.204.46:28585/api \
            -H "Content-Type: application/json" \
            -d '{"key":"value"}'
